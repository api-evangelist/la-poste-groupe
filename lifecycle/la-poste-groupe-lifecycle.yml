status_page:
  url: https://developer.laposte.fr/status/api
  machine_readable: https://developer.laposte.fr/api/statusApi
  auth_required: false
  format: JSON
  shape: 'statusApis.apiServer {name,state,duration} + statusApis.apis[] {name,state,duration}'
  observed_2026_09_02:
    gateway: 'okapi-api - OK (4 ms)'
    services:
    - {name: ControlAdresse v2, state: OK, duration_ms: 19}
    - {name: ControlAdresse v1, state: OK, duration_ms: 25}
    - {name: Digiposte v3, state: OK, duration_ms: 76}
    - {name: Geolocalisation v1, state: OK, duration_ms: 38}
