format: vendor
rfc9457: false
finding: >-
  There is no single error contract across this estate. Three different envelopes
  are in play - the Okapi gateway's {code,message}, Suivi's returnCode/returnMessage
  body carried INSIDE a 200 or 207, and Data Fair's text/plain error strings - and
  none of them is application/problem+json.
envelopes:
- name: okapi-gateway
  applies_to: every API routed through https://api.laposte.fr
  media_type: application/json
  shape:
    code: UPPER_SNAKE machine token
    message: human sentence
  observed: 'HTTP 401 -> {"code":"UNAUTHORIZED","message":"This action requires an authorization"}'
- name: suivi-returncode
  applies_to: La Poste Suivi v2
  media_type: application/json
  shape:
    returnCode: integer enum
    returnMessage: French sentence intended to be shown to the end customer
    idShip: the tracking number the row is about
    lang: response locale (fr_FR, en_GB, de_DE, it_IT, es_ES, nl_NL)
    scope: 'open'
  warning: >-
    The HTTP status is not the whole answer. A batch call returns HTTP 207 whose
    body is an ARRAY of these envelopes, each carrying its own returnCode - so a
    207 can contain a mix of successes and per-shipment failures. A client that
    branches only on the HTTP status will silently treat a failed lookup as a hit.
- name: data-fair-text
  applies_to: La Poste Open Data v1 (data.laposte.fr)
  media_type: text/plain
  shape: bare message string
  note: 404, 409, 413 and 500 are returned as text/plain, not JSON.
problem_types:
- id: UNAUTHORIZED
  status: 401
  envelope: okapi-gateway
  title: This action requires an authorization
  detail: >-
    No X-Okapi-Key header, an unknown key, or a key with no active subscription to
    the plan that fronts this API.
  remediation: >-
    Subscribe an application to a plan on developer.laposte.fr and send its key in
    the X-Okapi-Key header.
  evidence: live probe of https://api.laposte.fr/suivi/v2/idships/... on 2026-09-02
