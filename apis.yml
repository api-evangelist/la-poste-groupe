apis:
- name: La Poste ControlAdresse v2
  description: >-
    Address validation and normalisation against the French Service National de l'Adresse reference base.
    Autocompletes and corrects addresses as they are typed in signup forms, checkout flows and CRM records,
    and returns a normalised postal address for a given address code.
  humanURL: https://developer.laposte.fr/catalog-apis/controladresse@2
  baseURL: https://api.laposte.fr/controladresse/v2
  tags:
  - Addresses
  - Data Quality
  properties:
  - type: Documentation
    url: https://developer.laposte.fr/catalog-apis/controladresse@2
- name: La Poste Geolocalisation v1
  description: >-
    Forward geocoding over the La Poste address base - resolve a known postal address to the GPS coordinates
    La Poste holds for it, for mapping, routing and territory analysis.
  humanURL: https://developer.laposte.fr/catalog-apis/geolocalisation@1
  baseURL: https://api.laposte.fr/geolocalisation/v1
  tags:
  - Geocoding
  - Addresses
  properties:
  - type: Documentation
    url: https://developer.laposte.fr/catalog-apis/geolocalisation@1
- name: La Poste Geolocalisation inversee v1
  description: >-
    Reverse geocoding - given a latitude/longitude pair, returns between one and five nearby French postal
    addresses within a predefined radius.
  humanURL: https://developer.laposte.fr/catalog-apis/geolocinversee@1
  baseURL: https://api.laposte.fr/geolocinversee/v1
  tags:
  - Geocoding
  - Addresses
  properties:
  - type: Documentation
    url: https://developer.laposte.fr/catalog-apis/geolocinversee@1
- name: Code de la route v2
  description: >-
    Booking API for "Passer mon code avec La Poste" - the official La Poste driving-theory examination
    service. Covers session lookup, candidate validation, pre-reservations and reservations for both the
    standard (CLR) and CNM exam tracks.
  humanURL: https://developer.laposte.fr/catalog-apis/codedelaroute@2
  baseURL: https://api.laposte.fr/codedelaroute/v2
  tags:
  - Government
  - Booking
  properties:
  - type: Documentation
    url: https://developer.laposte.fr/catalog-apis/codedelaroute@2
- name: Colissimo Web Services
  description: >-
    Colissimo's SOAP web services for e-commerce shipping - shipping-label and return-label generation,
    pickup planning, deposit-slip (bordereau) generation, international product lookup, and pickup-point
    / relay-point search across post offices, Consignes Pickup lockers and relay merchants.
  humanURL: https://www.colissimo.entreprise.laposte.fr/outils-et-solutions
  baseURL: https://ws.colissimo.fr
  tags:
  - Shipping
  - Logistics
  - Package Tracking
  properties:
  - type: WSDL
    url: wsdl/la-poste-groupe-colissimo-sls.wsdl
  - type: WSDL
    url: wsdl/la-poste-groupe-colissimo-point-retrait.wsdl
  - type: Documentation
    url: https://developer.laposte.fr/catalog-apis/colissimo@1
