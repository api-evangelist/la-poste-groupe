aid: la-poste-groupe
name: La Poste Groupe
description: >-
  La Poste Groupe is the French state-owned postal, parcel, banking and digital
  services group. Its public API programme runs on Okapi, the group's own API
  management platform, published at developer.laposte.fr: nine APIs covering
  shipment tracking across mail, Colissimo and Chronopost (Suivi v2), address
  validation and normalisation (ControlAdresse v2), forward and reverse
  geocoding, the Digiposte certified digital-safe partner API, online registered
  mail (Lettre recommandee en ligne), driving-licence exam booking (Code de la
  route) and an Open Data gateway over data.laposte.fr. Colissimo, the group's
  parcel arm, additionally publishes SOAP contracts for label generation and
  pickup-point lookup at ws.colissimo.fr, and GeoPost/DPDgroup sits inside the
  same group. Access is metered by subscription plans with published quotas and
  prices, and calls are authenticated with an X-Okapi-Key header against the
  api.laposte.fr gateway.
url: https://raw.githubusercontent.com/api-evangelist/la-poste-groupe/refs/heads/main/apis.yml
