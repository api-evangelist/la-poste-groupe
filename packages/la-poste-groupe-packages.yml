  github.com/DeveloperLaPoste and github.com/LaPoste-Colissimo
summary: >-
  La Poste Groupe ships four first-party client libraries, and every one of them
  is abandoned. The two Okapi platform packages (the JavaScript SDK and the `oka`
  CLI) were last released in 2016 and 2017 respectively, against an Okapi platform
  that has since been rebuilt on a Next.js portal at developer.laposte.fr with a
  different subscription model. The two Magento 2 modules published by the
  Colissimo organisation were last released in 2017 and 2019. No first-party
  package exists for Suivi v2, ControlAdresse v2, Digiposte v3, Lettre recommandee
  en ligne or the Open Data API - the four APIs La Poste actively documents. Every
  package that speaks to those is third-party (hedii/colissimo-api,
  dansmaculotte/laposte-php, rigwild/suivi-poste, cleverage/colissimo-bundle).
