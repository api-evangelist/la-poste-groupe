        description: 'Pagination pour remonter dans l''historique.


          *Automatiquement renseigné par la propriété **next** du résultat de la requête précédente.*'
        schema:
          title: Pagination pour remonter dans l'historique
          default: 1
          type: integer
      responses:
        '200':
          description: Les révisions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Le nombre total de résultat si on ignore la pagination.
                  results:
                    type: array
                    items:
                      type: object
                      required: []
                      properties:
                        name:
                          type: string
                          title: Nom
                          x-refersTo: http://schema.org/name
                        description:
                          type: string
                          title: Description
                        category:
                          type: string
                          title: Catégorie
                        value:
                          type: number
                          title: Valeur
                        siret:
                          type: string
                          title: SIRET
                          x-refersTo: http://dbpedia.org/ontology/siret
                        image:
                          type: string
                          title: Image
                          x-refersTo: http://schema.org/image
                        document:
                          type: string
                          title: Document
                          x-refersTo: http://schema.org/DigitalDocument
                        _action:
                          type: string
                          title: Action
                          enum:
                          - create
                          - delete
                          - update
                          - createOrUpdate
                          - patch
                          description: "\n- create: crée la ligne\n- delete: supprime la ligne, nécessite la présence de _id\n- update: remplace la ligne, nécessite la présence de _id\n- createOrUpdate: crée la ligne si elle n'existe pas, sinon la remplace\n- patch: modifie la ligne, nécessite la présence de _id\n    "
                  next:
                    type: string
                    description: URL pour continuer la pagination.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Forbidden:
      description: Permissions insuffisantes pour effectuer cette opération.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: La ressource demandée n'existe pas.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: 'Non authentifié : aucune session ni clé d''API valide n''a été fournie.'
      content:
        text/plain:
          schema:
            type: string
    BadRequest:
      description: 'Requête invalide : corps de requête mal formé, paramètres manquants ou contraintes métier non respectées.'
      content:
        text/plain:
          schema:
            type: string
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-apiKey
    sdCookie:
      type: apiKey
      in: cookie
      name: id_token
externalDocs:
  description: Documentation sur GitHub
  url: https://data-fair.github.io/master/
