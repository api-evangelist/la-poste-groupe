                      cancellable: true
                      dematerialized_convention_date: '2017-05-30T12:46:34Z'
                      demo_account: false
                      field1_label: Aucun
                      id: ed249df4e1a149c9bc213bd9b4289a73
                      inbox_folder_id: c967c5116cb14e7aa172337f368ed172
                      membership_date: '2017-05-30T12:46:34Z'
                      request_date: '2017-05-30T12:46:34Z'
