                    membership_date: '2017-05-30T12:46:34Z'
                    request_date: '2017-05-30T12:46:34Z'
                    sender:
                      alternative_logo: https://static.interop.u-post.fr/share/public/images/senders/alt/OKAPI.png
                      auto_resiliation: true
