openapi: 3.2.0
info:
  description: '**Bienvenue sur l’API Coffre-fort numérique Digiposte +.**


    !Digiposte


    Cette API permet d’envoyer et archiver des documents certifiés dans un coffre-fort numérique Digiposte + à valeur probante, pour vos clients ou utilisateurs.'
  title: v3 Digiposte API
  version: ''
servers: []
tags:
- name: Digiposte
paths:
  /digiposte/v3/document/certified:
    post:
      parameters:
      - description: e.g. RXu1BMRbOmkB7uT+FNj3Sijtk7mgn/MuJWVFmcfoloi0n/zLy2++V/nm6gatpQzX
        example: RXu1BMRbOmkB7uT+FNj3Sijtk7mgn/MuJWVFmcfoloi0n/zLy2++V/nm6gatpQzX
        in: header
        name: X-Okapi-Key
        required: false
        schema:
          type: string
      - description: e.g. ed249df4e1a149c9bc213bd9b4289a73
        example: ed249df4e1a149c9bc213bd9b4289a73
        in: header
        name: X-RouteCode
        required: false
        schema:
          type: string
      - description: e.g. 2
        example: '2'
        in: header
        name: X-Api-Version-Minor
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/okapiKeyParameter'
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    document:
                      algo: SHA1
                      archive_duration: '2020-07-26T13:27:45.690'
                      author_tags: préfecture,essonne
                      file_name: test.pdf
                      file_size: '140939'
                      hash: e6122b1d8abd2afbeed93fb4672af8b23a5f56b6
                      id_routage: c441f90e99ca4f958131f1ed31e8fd65
                      title: Passeport certifié
                      type: PASSEPORT
          description: OK
          headers: {}
      security:
      - oauth2: []
      tags:
      - Digiposte
      description: 'Les contrôles d''intégrité sont assurés grâce à la taille du document et le calcul préalable d''une empreinte

        du document, et transmis par le truchement des paramètres obligatoires suivants :


        - `file_size`: taille du document transmis en octets


        - `algo`: algorythme utilisé pour le calcul de l''empreinte (MD5, SHA1, SHA256 ou SHA512)


        - `hash`: Empreinte de contrôle du document


        Par défaut, si aucune valeur `archive_duration` n''est spécifiée, la durée d''archivage légale du type de

        document s''applique. Quand la durée est atteinte, le document est conservé mais sa taille compte alors

        dans le quota de stockage de l''abonné.


        Les `author_tags`peuvent être spécifiés pour permettre à l''abonné de rechercher ses documents par mots-clés.


        Exemple de requête curl correspondant à l''appel décris ici :


        ```

        curl --header "X-Okapi-Key: RXu1BMRbOmkB7uT+FNj3Sijtk7mgn/MuJWVFmcfoloi0n/zLy2++V/nm6gatpQzX" \\

        --header "Authorization: bearer 16fc0b67-ca75-4082-b6ba-2079db1ce34d" \\

        --header "X-Dgp-UserId: 185fe86953e94e2692838a5f7cbff298"\\

        --header ''X-RouteCode: ed249df4e1a149c9bc213bd9b4289a73'' \\

        --header ''X-Api-Version-Minor: 2'' \\

        --header "Content-Type:multipart/form-data" \\

        -X POST http://api.laposte.fr/digiposte/v3/document/certified \\

        --form ''title=Passeport certifié'' --form ''type=PASSEPORT'' \\

        --form ''algo=SHA1'' --form ''hash=e6122b1d8abd2afbeed93fb4672af8b23a5f56b6'' \\

        --form ''file_name=test.pdf'' --form ''file_size=140939'' \\

        --form ''archive=@test.pdf;type=application/pdf'' \\

        --form ''archive_duration=2020-07-26T13:27:45.690'' \\

        --form ''author_tags=préfecture,essonne''

        {

        "document": {

        "type": "PASSEPORT",

        "title": "Passeport certifié",

        "file_name": "test.pdf",

        "archive_duration": "2020-07-26T13:27:45.690",

        "author_tags": "préfecture,essonne",

        "hash": "e6122b1d8abd2afbeed93fb4672af8b23a5f56b6",

        "algo": "SHA1",

        "file_size": "140939",

        "id_routage": "c441f90e99ca4f958131f1ed31e8fd65"

        }

        }

        ```'
      operationId: Déposer un document certifié
      requestBody:
        content:
          application/json:
            schema:
              properties:
                algo:
                  description: 'Algorithme de l''empreinte ex: MD5|SHA1|SHA256|SHA512'
                  type: string
                archive:
                  description: Document à ajouter (filename+type en header, binaire en body de la part)
                  type: string
                archive_duration:
                  description: Date de fin d'archivage légal
                  type: string
                author_tags:
                  description: Tags émetteur (séparés par des | ou des ,)
                  type: string
                file_name:
                  description: Nom du document (déprécié, utiliser title)
                  type: string
                file_size:
                  description: Taille du fichier en octets
                  type: string
                hash:
                  description: Empreinte de contrôle du document
                  type: string
                title:
                  description: Nom du document front sans extension
                  type: string
                type:
                  description: Nature de document, liste accessible par GET /profile/documents
                  type: string
              required:
              - title
              - type
              - algo
              - hash
              - file_name
              - file_size
              - archive
              type: object
      summary: Déposer un document certifié
  /digiposte/v3/membership:
