  /digiposte/v3/oauth/token:
    post:
      parameters:
      - description: e.g. RXu1BMRbOmkB7uT+FNj3Sijtk7mgn/MuJWVFmcfoloi0n/zLy2++V/nm6gatpQzX
        example: RXu1BMRbOmkB7uT+FNj3Sijtk7mgn/MuJWVFmcfoloi0n/zLy2++V/nm6gatpQzX
        in: header
        name: X-Okapi-Key
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/okapiKeyParameter'
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    access_token: b939b5d6-f3d1-43e4-877a-ecb46e616d40
                    expires_in: 3599
                    scope: trust
                    token_type: bearer
          description: OK
          headers: {}
      security:
      - basic: []
      tags:
      - Digiposte
      description: 'Concernant le dépôt lui-même, il n''est pas nécessaire d''avoir un token d''accès relié au compte d''un abonné,

        le dépôt pouvant avoir lieu à n''importe quel moment (pas de notion de session abonné), et l''adhésion

        représentant alors le consentement de l''utilisateur.


        Dans ce cas, un token en workflow oAuth standard « client_credentials » (token d''accès à l''application

        Digiposte) peut-être obtenu par cette requête de serveur à serveur.


        `POST /digiposte/v3/oauth/token` avec en body `grant_type=client_credentials`'
      operationId: Obtenir un token « client_credentials »
      summary: Obtenir un token « client_credentials »
components:
  parameters:
    okapiKeyParameter:
      description: Clé Okapi de l'application qui a souscrit à cette API. La clé proposée ci-dessous pour les tests est une clé partagée avec un faible nombre de requêtes autorisées / seconde. Elle retourne une erreur 429 en cas de quota dépassé. <b>Ne pas l'utiliser en production.</b>
      example: okapi-key
      in: header
      name: X-Okapi-Key
      required: true
      x-example: okapi-key
      schema:
        type: string
  securitySchemes:
    basic:
      scheme: basic
      type: http
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
