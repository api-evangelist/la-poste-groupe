                      pid: OKAPI
                      sender_side_convention: true
                      termination_message: Parcours de résiliation
                      type: SENDER
                      vip: false
                    sender_kind: 0
                    status: ACTIVE
          description: OK
          headers: {}
        '400':
          description: Bad Request
          headers: {}
      security:
      - oauth2: []
      - oauth2: []
      tags:
      - Digiposte
      description: 'Pour faire adhérer un abonné à un nouveau flux documentaire.


        Le statut d''une adhésion valide est `ACTIVE`.'
      operationId: Créer une adhésion
      requestBody:
        content:
          application/json:
            schema:
              example: {}
              properties: {}
              type: object
      summary: Créer une adhésion
  /digiposte/v3/membership/{id}:
    delete:
