                      convention_required: false
                      convention_url: https://api.laposte.fr
                      document_naming: Vos Documents Dématérialisés
                      form_data:
                        field1_label: Aucun
                        more_info: Adhésion automatique
                        security_plus: false
                        sender_pid: OKAPI
                      hr: false
                      is_multi_subscription: true
                      logo: https://static.interop.u-post.fr/share/public/images/senders/OKAPI.png
                      mail_trust: false
