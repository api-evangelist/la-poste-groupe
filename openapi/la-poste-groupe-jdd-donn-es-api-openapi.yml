        required: true
        explode: false
        schema:
          title: Colonne(s) de groupement
          type: array
          items:
            type: string
      - in: query
        name: interval
        description: 'La manière de grouper les valeurs par niveau d''agrégation.


          Pour grouper par valeur distincte utilisez "value" (comportement par défaut).


          Si la colonne de groupement est de type date vous pouvez utiliser un intervalle de calendrier comme "year", "month", etc ([voir la documentation Elasticsearch](https://www.elastic.co/docs/reference/aggregations/search-aggregations-bucket-datehistogram-aggregation#calendar_intervals)).


          Si la colonne est numérique vous pouvez saisir un nombre qui sera utilisé comme intervalle de groupement des valeurs.'
        required: false
        explode: false
        schema:
          title: Interval(s) de groupement
          type: array
          items:
            type: string
      - in: query
        name: html
        description: Effectuer le rendu des contenus formatés de **markdown** vers **HTML**.
        schema:
          title: Rendu HTML des contenus markdown
          type: boolean
      - in: query
        name: metric
        description: "La métrique à appliquer par niveau de groupement :\n  - `avg` : moyenne\n  - `sum` : somme\n  - `min` : valeur minimale\n  - `max` : valeur maximale\n  - `value_count` : nombre de valeurs\n  - `cardinality` : nombre de valeurs distinctes (approximatif à partir de 40 000)\n            "
        explode: false
        schema:
          title: Métrique
          type: string
          enum:
          - avg
          - sum
          - min
          - max
          - cardinality
          - value_count
      - in: query
        name: metric_field
        description: La clé de la colonne sur laquelle effectuer le calcul de métrique par niveau de groupement.
        schema:
          type: string
      - in: query
        name: missing
        description: Nom du groupe des lignes pour lesquelles la colonne de groupement est vide.
        explode: false
        schema:
          title: Groupe des valeurs manquantes
          type: array
          items:
            type: string
      - in: query
        name: agg_size
        description: Le nombre de groupes par niveau de groupement.
        explode: false
        schema:
          type: array
          items:
            default: 20
            type: integer
            maximum: 10000
      - in: query
        name: size
        description: Le nombre de résultats à retourner (taille de la pagination).
        schema:
          title: Taille de la pagination
          default: 0
          type: integer
          maximum: 100
      - in: query
        name: sort
        description: '

          Le tri à effectuer sous forme d''une liste de clés séparées par des virgules.


          Pour chaque niveau d''agrégation il est possible de trier par le nombre d''éléments dans le groupe ("count" et "-count") ou par la clé du groupe ("key" et "-key").


          Ensuite il est possible d''ajouter des instructions de tri pour les résultats imbriqués dans le dernier niveau d''agrégation sous forme d''une liste de clés de colonnes.


          Exemple : `-count,key,ma_colonne,-ma_colonne2`'
        schema:
          title: Ordre des résultats
          type: array
          items:
