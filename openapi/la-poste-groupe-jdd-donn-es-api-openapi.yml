        masterData:
          type: object
          title: Données de référence
          layout:
            title: null
          properties:
            shareOrgs:
              type: array
              title: Partagez cette donnée de référence avec vos partenaires
              description: Le partage à des partenaires affecte simplement la visibilité des actions liées à ces données de référence. Il est sans effet sur les permissions que vous devez définir séparément.
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
              layout:
                if:
                  type: js-eval
                  expr: context.ownerOrg
                  pure: true
                props:
                  noDataText: Vous n'avez pas encore de partenaires configurés pour votre organisation.
                getItems:
                  url:
                    type: js-tpl
                    expr: ${context.directoryUrl}/api/${context.dataset.owner.type}s/${context.dataset.owner.id}
                    pure: true
                  itemKey: data["id"]
                  itemTitle: data["name"]
                  itemsResults: data["partners"]
            bulkSearchs:
              type: array
              title: Récupération de lignes en masse
              description: Permettez à vos utilisateurs de récupérer un grand nombre de lignes à partir d'une règle de correspondance simple. Cette fonctionnalité permet de créer une nouvelle source d'enrichissement.
              items:
                type: object
                required:
                - title
                properties:
                  id:
                    type: string
                    title: Identifiant
                    readOnly: true
                    layout:
                      if:
                        type: js-eval
                        expr: parent.data.id
                        pure: false
                  title:
                    type: string
                    title: Titre
                    minLength: 3
                    layout:
                      props:
                        placeholder: Exemple "Récupérer les informations de plusieurs produits"
                  description:
                    type: string
                    title: Description
                    layout:
                      comp: textarea
                      props:
                        placeholder: Exemple "Cet enrichissement vous permet de récupérer les informations de plusieurs produits à partir d'une liste de codes produits."
                  filters:
                    type: array
                    title: Filtres statiques
                    items:
                      type: object
                      required:
                      - property
                      - values
                      properties:
                        property:
                          type: object
                          title: Propriété sur laquelle appliquer le filtre
                          layout:
                            getItems:
                              type: js-eval
                              expr: context.filterProperties
                              pure: true
                              itemKey: data["key"]
                              itemTitle: data["title"]
                        values:
                          type: array
                          title: Valeurs
                          items:
                            type: string
                  input:
                    type: array
                    title: Méthodes de correspondance
                    minItems: 1
                    items:
                      type: object
                      required:
                      - type
                      - property
                      oneOf:
                      - title: Valeurs exactement égales
                        required:
                        - type
                        - property
                        properties:
                          type:
                            type: string
                            const: equals
                            title: Type de méthode de correspondance
                          property:
                            type: object
                            title: Propriété comparée
                            layout:
                              props:
                                noDataText: Aucune colonne de ce jeu de données n'a de concept associé. Définissez des concepts dans l'onglet Schéma.
                              getItems:
                                type: js-eval
                                expr: context.propertiesWithConcepts
                                pure: true
                                itemKey: data["key"]
                                itemTitle: data["title"]
                      - title: Date dans un intervalle
                        required:
                        - type
                        - property
                        properties:
                          type:
                            type: string
                            const: date-in-interval
                          property:
                            type: object
                            title: Date à renseigner
                            properties:
                              x-refersTo:
                                type: string
                                const: http://schema.org/Date
                              key:
                                type: string
                                const: _date
                              type:
                                type: string
                                const: string
                              format:
                                type: string
                                const: date-time
                        layout:
                          if:
                            type: js-eval
                            expr: context.hasDateIntervalConcepts
                            pure: true
                      - title: Coordonnée géographique à proximité
                        required:
                        - type
                        - distance
                        properties:
                          type:
                            type: string
                            const: geo-distance
                          distance:
                            type: integer
                            title: Distance
                            default: 0
                          property:
                            type: object
                            title: Point à renseigner
                            properties:
                              x-refersTo:
                                type: string
                                const: http://www.w3.org/2003/01/geo/wgs84_pos#lat_long
                              key:
                                type: string
                                const: _geopoint
                              type:
                                type: string
                                const: string
                        layout:
                          if:
                            type: js-eval
                            expr: context.dataset.bbox
                            pure: true
                      oneOfLayout:
                        label: Type de méthode de correspondance
                  sort:
                    type: string
                    title: Tri pour choisir parmi des résultats ambigus
                    description: '

                      Remarque : ce paramètre est optionnel et utile uniquement si la manière d''établir une correspondance est susceptible de retourner plusieurs résultats par ligne.


                      Le tri est exprimé sous forme d''une liste de clés de colonnes séparées par des virgules. Par défaut le tri est ascendant, si un nom de colonne est préfixé par un "-" alors le tri sera descendant.


                      Exemple: ma_colonne,-ma_colonne2'
              layout:
                itemTitle: data.title
            singleSearchs:
              type: array
              title: Recherche de paires code / libellé
              description: Permettez à vos utilisateurs de récupérer une liste de résultats à partir d'une recherche textuelle sur une colonne de libellés. Cette fonctionnalité permet de créer des champs de recherche dans les formulaires d'édition de ligne des jeux éditables.
              items:
                type: object
                required:
                - title
                - output
                properties:
                  id:
                    type: string
                    title: Identifiant
                    readOnly: true
                    layout:
                      if:
                        type: js-eval
                        expr: parent.data.id
                        pure: false
                  title:
                    type: string
                    title: Titre
                    minLength: 3
                    layout:
                      props:
                        placeholder: Exemple "Recherche d'un produit"
                  description:
                    type: string
                    title: Description
                    layout:
                      comp: textarea
                      props:
                        placeholder: Exemple "Récupérez un code produit en effectuant une recherche dans son code ou son libellé"
                  output:
                    type: object
                    title: Propriété à retourner (code)
                    layout:
                      props:
                        noDataText: Aucune colonne de ce jeu de données n'a de concept associé. Définissez des concepts dans l'onglet Schéma.
                      getItems:
                        type: js-eval
                        expr: context.propertiesWithConcepts
                        pure: true
                        itemKey: data["key"]
                        itemTitle: data["title"]
                  label:
                    type: object
                    title: Propriété affichée lors de la saisie (libellé)
                    description: Propriété affichée à côté du code dans la liste des suggestions, sous la forme « code (libellé) », pour aider l'utilisateur à identifier la bonne valeur. La recherche s'effectue sur toutes les colonnes textuelles du jeu de données.
                    layout:
                      props:
                        noDataText: Aucune colonne textuelle dans ce jeu de données.
                      getItems:
                        type: js-eval
                        expr: context.stringProperties
                        pure: true
                        itemKey: data["key"]
                        itemTitle: data["title"]
                  filters:
                    type: array
                    title: Filtres statiques
                    items:
                      type: object
                      required:
                      - property
                      - values
                      properties:
                        property:
                          type: object
                          title: Propriété sur laquelle appliquer le filtre
                          layout:
                            getItems:
                              type: js-eval
                              expr: context.filterProperties
                              pure: true
                              itemKey: data["key"]
                              itemTitle: data["title"]
                        values:
                          type: array
                          title: Valeurs
                          items:
                            type: string
              layout:
                itemTitle: data.title
            virtualDatasets:
              type: object
              description: Proposez à vos utilisateurs de créer des jeux virtuels à partir de ce jeu de données. C'est une option intéressante pour faciliter la création de vues filtrées de cette donnée.
              properties:
