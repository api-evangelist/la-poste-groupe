      - JDD / Données
      responses:
        '200':
          description: Le jeu de données après annulation du brouillon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflit : le jeu de données est verrouillé ou se trouve dans un état incompatible avec cette opération.'
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    dataset:
      x-exports:
      - types
      - resolvedSchema
      title: Dataset
      type: object
      additionalProperties: false
      required:
      - id
      - createdAt
      - owner
      - title
      properties:
        id:
          type: string
          description: Globally unique identifier of the dataset
          pattern: ^[a-z0-9_\-]+$
        slug:
          type: string
          description: Identifier of the dataset, usually a slug for URL readability (unique inside the tenant)
          pattern: ^[a-z0-9]{1}[a-z0-9_\-]*[a-z0-9]{1}$
        href:
          type: string
          description: Readonly field. The URL where this resource can be fetched
        page:
          type: string
          description: Readonly field. The URL where this resource can be viewed in the UI
        title:
          type: string
          description: Short title of the dataset
        summary:
          type: string
          description: Short description of the dataset
        description:
          type: string
          description: Detailed description of the dataset
        image:
          type: string
          description: URL d'une image, illustration du jeu de données
        spatial:
          type: string
          description: spatial coverage
        temporal:
          type: object
          description: temporal coverage
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        keywords:
          type: array
          description: keywords
          items:
            type: string
        frequency:
          type: string
          description: update frequency
          enum:
          - ''
          - triennial
          - biennial
          - annual
          - semiannual
          - threeTimesAYear
          - quarterly
          - bimonthly
          - monthly
          - semimonthly
          - biweekly
          - threeTimesAMonth
          - weekly
          - semiweekly
          - threeTimesAWeek
          - daily
          - continuous
          - irregular
        creator:
          type: string
        modified:
          type: string
          format: date
        visibility:
          type: string
          enum:
          - public
          - protected
          - private
        file:
          type: object
          additionalProperties: false
          required:
          - name
          - size
          - mimetype
          - schema
          properties:
            name:
              type: string
              description: Name of the file that was used to create or update this dataset
            size:
              type: number
              description: Size of the file on disk
            encoding:
              type: string
              description: Encoding of the file (either explicitly defined or detected)
            explicitEncoding:
              type: string
              description: Encoding of the file explicitly defined when loading it
            mimetype:
              type: string
              description: Mime type of the file
            schema:
              type: array
              description: JSON schema properties of the fields in the file
              items:
                type: object
                required:
                - key
                properties:
                  key:
                    type: string
                  separator:
                    type:
                    - string
                    - 'null'
                  dateFormat:
                    type:
                    - string
                    - 'null'
                  dateTimeFormat:
                    type:
                    - string
                    - 'null'
                  timeZone:
                    type:
                    - string
                    - 'null'
            props:
              type: object
              additionalProperties: false
              properties:
                numLines:
                  type: number
                  description: Number of lines this file has.
                linesDelimiter:
                  type: string
                  description: "New line character or characters (can be \n))"
                fieldsDelimiter:
                  type: string
                  description: Fields delimiter
                escapeChar:
                  type: string
                  description: Character used to escape string
                quote:
                  type: string
                  description: Character used to wrap strings
        originalFile:
          type: object
          additionalProperties: false
          required:
          - name
          - size
          - mimetype
          properties:
            name:
              type: string
              description: Name of the file that was used to create or update this dataset
            size:
              type: number
              description: Size of the file on disk
            encoding:
              type: string
              description: Encoding of the file (either explicitly defined or detected)
            explicitEncoding:
              type: string
              description: Encoding of the file explicitly defined when loading it
            normalizeOptions:
              type: object
              description: Normalize options specific to the original file format
              additionalProperties: false
              properties:
                spreadsheetWorksheetIndex:
                  type: number
                spreadsheetHeaderLine:
                  type: number
                spreadsheetStartCol:
                  type: number
            mimetype:
              type: string
              description: Mime type of the file
            md5:
              type: string
              description: MD5 hash of the file content
        attachments:
          type: array
          items:
            type: object
            required:
            - title
            properties:
              title:
                type: string
                title: Titre
                layout:
                  props:
                    outlined: true
                    dense: true
              description:
                type: string
                title: Description
                layout: markdown
              includeInCatalogPublications:
                type: boolean
                title: Inclure dans les publications sur catalogue
                default: false
            oneOf:
            - title: Fichier
              required:
              - name
              properties:
                type:
                  title: Type de pièce jointe
                  const: file
                name:
                  layout: none
                  type: string
                  description: Name of the file that was used to create or update this attachment
                size:
                  layout: none
                  type: number
                  description: Size of the file on disk
                mimetype:
                  layout: none
                  type: string
                  description: Mime type of the file
                updatedAt:
                  layout: none
                  type: string
                  description: Date of the last update for this attachment
                  format: date-time
                url:
                  layout: none
                  readOnly: true
                  type: string
                  title: URL
            - title: Lien
              required:
              - url
              properties:
                type:
                  title: Type de pièce jointe
                  const: url
                url:
                  type: string
                  title: URL
            - title: Fichier récupéré depuis une URL
              required:
              - name
              properties:
                type:
                  title: Type de pièce jointe
                  const: remoteFile
                name:
                  type: string
                  title: Nom du fichier
                  description: Ce nom doit contenir l'extension qui doit correspondre au format du fichier téléchargé.
                  layout:
                    rules:
                    - hasExtension
                targetUrl:
                  type: string
                  title: URL de téléchargement
                  description: Cette URL n'est pas consultable après écriture. Elle est utilisée pour télécharger le fichier depuis un service distant et peut contenir un secret. Vous pouvez la laisser vide quand vous modifiez les autres informations, mais vous devez la renseigner de nouveau si vous changez le nom de fichier.
        storage:
          type: object
          description: All storage space info of this dataset
          properties:
            size:
              type: integer
            indexed:
              type: object
              properties:
                size:
                  type: integer
                parts:
                  type: array
                  items:
                    type: string
                    enum:
                    - collection
                    - original-file
                    - normalized-file
                    - full-file
                    - attachments
                    - master-data
            attachments:
              type: object
              properties:
                count:
                  type: integer
                size:
                  type: integer
            metadataAttachments:
              type: object
              properties:
                count:
                  type: integer
                size:
