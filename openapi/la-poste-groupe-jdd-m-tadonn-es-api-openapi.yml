                    type: array
                    title: Méthodes de correspondance
                    minItems: 1
                    items:
                      type: object
                      required:
                      - type
                      - property
                      oneOf:
                      - title: Valeurs exactement égales
                        required:
                        - type
                        - property
                        properties:
                          type:
                            type: string
                            const: equals
                            title: Type de méthode de correspondance
                          property:
                            type: object
                            title: Propriété comparée
                            layout:
                              props:
                                noDataText: Aucune colonne de ce jeu de données n'a de concept associé. Définissez des concepts dans l'onglet Schéma.
                              getItems:
                                type: js-eval
                                expr: context.propertiesWithConcepts
                                pure: true
                                itemKey: data["key"]
                                itemTitle: data["title"]
                      - title: Date dans un intervalle
