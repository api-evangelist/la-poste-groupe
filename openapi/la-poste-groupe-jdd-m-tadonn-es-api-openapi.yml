  /datasets/{id}/schema:
    parameters:
    - in: path
      name: id
      description: Identifiant du jeu de données. L'identifiant de publication (`slug`) fonctionne aussi lorsque l'API est appelée depuis un portail.
      required: true
      schema:
        type: string
        title: Identifiant du jeu de données
    get:
      summary: Lire le schéma
      description: Récupérer la liste des colonnes et leurs détails, incluant la cardinalité (`x-cardinality`) et les énumérations de valeurs distinctes (`enum`).
      operationId: readSchema
      x-permissionClass: read
      tags:
      - JDD / Métadonnées
      parameters:
      - in: query
        name: mimeType
        description: Définir le format du schéma.
        required: false
        schema:
          title: Format du schéma
          type: string
          default: application/json
          enum:
          - application/json
          - application/tableschema+json
          - application/schema+json
      - in: query
        name: type
        description: Filtre sur le type de colonne
        required: false
        schema:
          title: Filtre sur le type de colonne
          type: array
          items:
            type: string
            enum:
            - string
            - boolean
            - integer
            - number
        style: form
        explode: false
      - in: query
        name: format
        description: Filtre sur le format d'une colonne de type chaîne de caractères
        required: false
        schema:
          title: Filtre sur le format d'une colonne
          type: array
          items:
            type: string
            enum:
            - uri-reference
            - date
            - date-time
        style: form
        explode: false
      - in: query
        name: capability
        description: 'Restreindre aux colonnes ayant une capacité particulière.


          - `index` — **Filtrable sur valeur exacte** : Désactivez cette capacité si la donnée contient par exemple des textes longs pour lesquels des filtres sur valeurs exactes ont peu de sens.

          - `values` — **Triable et groupable** : Désactivez cette capacité si la donnée contient par exemple des textes longs pour lesquels trier ou grouper par valeur a peu de sens.

          - `textStandard` — **Texte analysé pour recherche textuelle** : Désactivez cette capacité dans le cas d''un code, une url, etc. N''importe quel contenu sur lequel la recherche de mots a peu de sens.

          - `text` — **Texte analysé spécifiquement pour la langue française** : Désactivez cette capacité pour tout contenu qui n''est pas en langue française ou pour lequel la recherche de mots a peu de sens.

          - `textAgg` — **Statistiques de mots** : Activez cette capacité si avez l''intention d''obtenir des statistiques sur les occurrences de mots (par exemple pour construire un nuage de mot).

          - `wildcard` — **Texte filtrable sur groupe de caractères** : Activez cette capacité si vous avez l''intention de filtrer ce contenu spécifiquement sur une suite de caractères (par exemple si un filtre sur mots entiers ou sur valeur exacte ne convient pas).

          - `insensitive` — **Tri amélioré avec casse et accents** : Désactivez cette capacité si le contenu ne sera pas utilisé pour du tri ou bien si il ne contient pas de variations avec accents et majuscules.

          - `geoShape` — **Formes géométriques complexes** : Désactivez cette capacité si la donnée ne contient que des géométries basiques de points ou bien si requêter les géométries uniquement à partir de leurs centroïdes est suffisant pour vos besoins.

          - `vtPrepare` — **Tuiles vectorielles préparées** : Activez cette capacité pour précalculer des éléments utiles à la construction de tuiles vectorielles pour le rendu cartographique du jeu de données. Activez cette option si le jeu de données contient des données géogreaphiques denses à afficher en grande quantité. La contre-partie est une augmentation du temps d''indexation et du volume de données indexées.

          - `indexAttachment` — **Contenu des pièces jointes analysé pour recherche textuelle** : Désactivez cette option si vous souhaitez que les pièces jointes soient simplement téléchargeables et que l''extraction de leur contenu textuel pour recherche de mots n''est pas pertinente.'
        required: false
        schema:
          title: Restreindre par capacité de la colonne
          type: string
          enum:
          - index
          - values
          - textStandard
          - text
          - textAgg
          - wildcard
          - insensitive
          - geoShape
          - vtPrepare
          - indexAttachment
      - in: query
        name: enum
        description: Restreindre aux colonnes ayant une énumération de valeurs (moins de 50 valeurs distinctes).
        required: false
        schema:
          title: Restreindre par colonnes énumérables
          type: string
          enum:
          - 'false'
          - 'true'
      - in: query
        name: calculated
        description: 'Inclure ou non les colonnes calculées par Data Fair, c''est-à-dire les colonnes qui ne sont pas issues du fichier d''origine.


          Par défaut ces colonnes sont **incluses**. Mettre `false` pour les exclure.


          *Exception : avec le format `mimeType=application/schema+json` elles sont par défaut exclues.*'
        required: false
        schema:
          title: Inclure les colonnes calculées
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: La liste des colonnes.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
