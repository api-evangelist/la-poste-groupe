                      properties:
                        property:
                          type: object
                          title: Propriété sur laquelle appliquer le filtre
                          layout:
                            getItems:
                              type: js-eval
                              expr: context.filterProperties
                              pure: true
                              itemKey: data["key"]
                              itemTitle: data["title"]
                        values:
                          type: array
                          title: Valeurs
                          items:
                            type: string
              layout:
                itemTitle: data.title
