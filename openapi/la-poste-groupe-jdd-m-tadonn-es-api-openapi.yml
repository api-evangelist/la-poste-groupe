                          type:
                            type: string
                            const: date-in-interval
                          property:
                            type: object
                            title: Date à renseigner
                            properties:
                              x-refersTo:
                                type: string
                                const: http://schema.org/Date
                              key:
                                type: string
                                const: _date
                              type:
                                type: string
                                const: string
                              format:
                                type: string
                                const: date-time
                        layout:
                          if:
                            type: js-eval
                            expr: context.hasDateIntervalConcepts
                            pure: true
                      - title: Coordonnée géographique à proximité
                        required:
                        - type
                        - distance
                        properties:
                          type:
